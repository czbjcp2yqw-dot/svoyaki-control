  <style>
    :root{color-scheme:dark;--bg:#0c111b;--panel:#141b28;--panel2:#192232;--line:#293445;--text:#edf3ff;--muted:#93a2b7;--accent:#b7f36c;--accentText:#1c2710;--blue:#82bbff;--red:#f9a2a7;--amber:#f3c478;--radius:17px;--shadow:0 20px 60px #0003}

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--blue)}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .layout{min-height:100vh;display:flex}.aside{width:246px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:29px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:-.7px;margin:1px 9px 33px}.brand-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:var(--accent);color:var(--accentText);font-size:20px}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:20px 13px 10px}.nav-link{border:0;background:transparent;color:var(--muted);width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;font-weight:600;margin:2px 0}.nav-link:hover{background:var(--panel2);color:var(--text)}.nav-link.active{background:var(--panel2);color:var(--accent)}.nav-ico{font-size:17px;width:22px;text-align:center}.aside-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px}.main{flex:1;min-width:0;padding:31px 35px 70px;max-width:1600px;margin:auto}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.header h1{font-size:31px;line-height:1.2;letter-spacing:-1.1px;margin:4px 0 8px}.sub{color:var(--muted);margin:0}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:11px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;min-height:41px}.btn:hover{filter:brightness(1.12)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.btn.danger{color:var(--red)}.btn.small{min-height:32px;padding:6px 10px;font-size:12px}.btn.ghost{background:transparent}.input,.select,.textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);min-width:0;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue)}.textarea{resize:vertical;min-height:88px}.select option{color:#111}.field label{display:block;margin-bottom:6px;color:var(--muted);font-weight:650;font-size:12px}.field{min-width:0}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}.tiny{font-size:12px}.strong{font-weight:750}.hero{background:linear-gradient(123deg,#263347 0%,#172434 53%,#18242d 100%);border:1px solid #33465a;border-radius:21px;padding:25px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px;color:#fff;overflow:hidden}.hero h2{font-size:24px;letter-spacing:-.8px;margin:4px 0 9px}.hero p{margin:0;color:#b9c4d5;max-width:550px}.hero-art{font-size:69px;opacity:.8;filter:drop-shadow(0 5px 30px #b7f36850)}.chip{border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;color:var(--muted);font-weight:700;font-size:11px}.hero .chip{color:#d3e7ff;border-color:#6a7888}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:25px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px 20px;min-height:113px}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:13px}.stat strong{font-size:29px;letter-spacing:-1px;line-height:1}.stat small{font-size:11px;color:var(--muted);margin-left:8px}.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0;margin-bottom:20px}.section-head{padding:19px 21px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.section-title{font-size:16px;font-weight:800;letter-spacing:-.3px;margin:0}.section-body{padding:18px 21px}.task{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:13px}.task:last-child{border-bottom:0}.task:hover{background:var(--panel2)}.task-title{font-size:14px;font-weight:800;margin-bottom:3px}.task-sub{font-size:12px;color:var(--muted)}.task-time{font-weight:800;color:var(--accent);min-width:48px}.pill{font-size:10px;display:inline-block;border-radius:999px;font-weight:800;padding:5px 8px;white-space:nowrap;background:#5479a426;color:#9ac8ff}.light .pill{background:#eaf0ff;color:#355fa4}.pill.done{background:#65b78b27;color:#88dbac}.light .pill.done{color:#267a4c}.pill.warn{background:#dba65623;color:var(--amber)}.pill.bad{background:#cd667b23;color:var(--red)}.empty{padding:35px 20px;text-align:center;color:var(--muted)}.empty strong{color:var(--text);display:block;margin:6px}.progress{height:7px;background:var(--panel2);border-radius:30px;overflow:hidden;margin-top:9px}.progress > span{display:block;height:100%;background:var(--accent);border-radius:30px}.person{padding:14px 0;border-bottom:1px solid var(--line)}.person:last-child{border-bottom:none}.avatar{width:34px;height:34px;border-radius:11px;background:#324c59;color:#d9ffff;display:grid;place-items:center;font-weight:900;flex:none}.calendar-scroll{overflow:auto;max-width:100%}.week{display:grid;grid-template-columns:120px repeat(7,minmax(105px,1fr));min-width:930px}.week .day-h{padding:12px 8px;text-align:center;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.week .day-h.today{color:var(--accent);font-weight:850}.week .employee-h{padding:15px 12px;border-bottom:1px solid var(--line);font-weight:750;background:var(--panel2);font-size:12px}.week .cell{min-height:95px;padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:5px}.event{width:100%;padding:7px 8px;border:1px solid #6ea7c655;background:#78b4c120;color:var(--text);border-radius:8px;text-align:left;font-size:11px;line-height:1.35}.event:hover{border-color:var(--blue)}.event b{color:var(--blue)}.view-tools{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.list-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.list-tools .input{width:min(310px,100%)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.span2{grid-column:span 2}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;border-bottom:1px solid var(--line);padding:12px}.table td{border-bottom:1px solid var(--line);padding:13px 12px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.object-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.object{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);text-align:left;color:var(--text);min-height:160px}.object:hover{border-color:var(--accent)}.object strong{display:block;font-size:17px;margin:8px 0}.object p{color:var(--muted);margin:0}.modal-overlay{position:fixed;inset:0;background:#040910c9;z-index:30;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}.modal{width:min(680px,100%);max-height:min(90vh,900px);overflow:auto;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:21px}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding:17px 22px}.modal-head h2{margin:0;font-size:19px}.modal-body{padding:20px 22px}.modal-foot{border-top:1px solid var(--line);padding:16px 22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.detail-block{padding:14px 0;border-bottom:1px solid var(--line)}.detail-block:last-child{border:0}.detail-block .tiny{display:block;margin-bottom:5px}.pre{white-space:pre-wrap;background:var(--panel2);padding:16px;border:1px solid var(--line);border-radius:11px;max-height:350px;overflow:auto;font-size:12px}.notice{background:#d4af4a13;border:1px solid #d4af4a55;color:var(--amber);border-radius:11px;padding:12px 14px;font-size:12px;margin-bottom:17px}.notice.info{background:#73b4e311;border-color:#73b4e355;color:var(--muted)}.toast{position:fixed;right:20px;bottom:25px;background:var(--accent);color:var(--accentText);border-radius:11px;padding:12px 17px;z-index:90;font-weight:800;box-shadow:var(--shadow)}.footer-note{margin-top:30px;text-align:center;font-size:11px;color:var(--muted)}.mobile-nav{display:none}.mobile-only{display:none}.click{cursor:pointer}.task-actions{display:flex;gap:6px;align-items:center}.metric-row{padding:12px 0;border-bottom:1px solid var(--line)}.metric-row:last-child{border:0}button.link{border:0;background:transparent;color:var(--blue);font-weight:750;padding:5px}.menu-wrap{display:flex;gap:6px;align-items:center}.hide{display:none!important}
    @media(max-width:1050px){.aside{width:205px}.main{padding:26px 20px 75px}.grid2{grid-template-columns:1fr}.object-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:740px){.aside{display:none}.main{padding:22px 14px 105px}.header{align-items:flex-start}.header h1{font-size:26px}.header .toolbar{justify-content:flex-end}.header .toolbar .hide-mobile{display:none}.hero{padding:22px 18px}.hero h2{font-size:21px}.hero-art{font-size:38px}.stats{gap:9px}.stat{padding:14px 15px;min-height:91px}.stat span{margin-bottom:8px;font-size:11px}.stat strong{font-size:24px}.section-head,.section-body{padding:15px}.task{padding:12px}.task-actions{flex-wrap:wrap;justify-content:flex-end}.object-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span2{grid-column:span 1}.mobile-nav{display:flex;position:fixed;z-index:12;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:7px 8px max(7px,env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:55px;padding:5px 2px}.mobile-nav button.active{color:var(--accent);font-weight:800}.mobile-nav .nav-ico{font-size:21px}.mobile-only{display:block}.modal-overlay{padding:0;align-items:end}.modal{border-radius:22px 22px 0 0;max-height:94vh;width:100%}.modal-body{padding:18px}.modal-head,.modal-foot{padding:16px}.table-wrap{overflow:auto}.view-tools{align-items:flex-start}.toast{bottom:93px;left:15px;right:15px}}
    @media(max-width:380px){.header .toolbar .btn{padding:9px}.stats{grid-template-columns:repeat(2,1fr)}.stat small{display:none}.hero-art{display:none}}
  </style>

<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script src="./cloud.js"></script>
  <script>
  (function(){
    "use strict";
    var STORAGE="production-planner-mvp-v1";
    var THEME_KEY="production-planner-theme";
    var statuses={new:"Новая",assigned:"Назначена",confirmed:"Подтверждена",in_progress:"В работе",filmed:"Снято",uploaded:"Материалы сданы",checked:"Проверено",closed:"Закрыто",cancelled:"Отменена"};
    var nav=[["dashboard","⌂","Главная"],["calendar","▦","Календарь"],["tasks","▤","Съёмки"],["objects","◇","Объекты"],["team","♧","Команда"],["reports","◫","Отчёты"]];
    var today=localDay(new Date()),selectedDay=today,view="dashboard",role="coordinator",operatorId=1,search="",statusFilter="all",modal=null,planText="",toastTimer=null;
    function localDay(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
    function addDays(date,n){var d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);return localDay(d)}
    function niceDate(d){return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
    function shortDate(d){return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})}
    function dow(d){return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{weekday:"short"})}
    function monday(d){var x=new Date(d+"T12:00:00");x.setDate(x.getDate()-(x.getDay()+6)%7);return localDay(x)}
    function n(v){return Number(v)||0}
    function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
    function url(v){try{var u=new URL(v);return ["http:","https:"].includes(u.protocol)?u.href:""}catch(e){return ""}}
    function initials(name){return String(name||"").split(" ").map(function(p){return p.charAt(0)}).join("").slice(0,2).toUpperCase()}
    function id(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
    function load(){try{var a=JSON.parse(localStorage.getItem(STORAGE));if(a&&Array.isArray(a.tasks)&&Array.isArray(a.employees))return a}catch(e){}return seed()}
    function seed(){return {employees:[{id:1,name:"Александра",job:"Видеооператор",hours:8},{id:2,name:"Сергей",job:"Видеооператор",hours:8},{id:3,name:"Михаил",job:"Видеооператор",hours:8},{id:4,name:"Георгий",job:"Фотограф",hours:8}],tasks:[
      {id:id(),title:"Ход строительства",project:"Объект А",address:"Москва, объект А — адрес уточняется",date:today,time:"09:00",duration:120,employeeId:1,type:"Видео",brief:"Общие и крупные планы, динамика объекта.",details:"Уточнить точки съёмки у координатора. Снять общие, средние и детали.",contact:"Контакт уточняется",status:"assigned",link:"",note:""},
      {id:id(),title:"Интервью на объекте",project:"Объект Б",address:"Москва, объект Б — адрес уточняется",date:today,time:"12:00",duration:90,employeeId:2,type:"Видео",brief:"Интервью с представителем объекта.",details:"Обеспечить чистый звук, снять перебивки.",contact:"Контакт уточняется",status:"confirmed",link:"",note:""},
      {id:id(),title:"Архитектурная фотосъёмка",project:"Объект В",address:"Москва, объект В — адрес уточняется",date:today,time:"11:00",duration:150,employeeId:4,type:"Фото",brief:"Фасады и благоустройство.",details:"Снять фасады, общий вид, детали входной группы.",contact:"Контакт уточняется",status:"in_progress",link:"",note:""},
      {id:id(),title:"Панорамы территории",project:"Объект А",address:"Москва, объект А — адрес уточняется",date:addDays(today,1),time:"10:30",duration:120,employeeId:3,type:"Видео",brief:"Панорамы, общие планы.",details:"Проверить погодные условия перед выездом.",contact:"Контакт уточняется",status:"assigned",link:"",note:""},
      {id:id(),title:"Контроль этапа работ",project:"Объект Б",address:"Москва, объект Б — адрес уточняется",date:addDays(today,2),time:"15:00",duration:90,employeeId:1,type:"Видео",brief:"Текущий этап работ.",details:"Снять объект с нескольких точек.",contact:"Контакт уточняется",status:"new",link:"",note:""},
      {id:id(),title:"Фотосъёмка завершённого этапа",project:"Объект В",address:"Москва, объект В — адрес уточняется",date:addDays(today,-1),time:"10:00",duration:120,employeeId:4,type:"Фото",brief:"Фотоархив этапа.",details:"Собрать фотографии по отдельным адресам.",contact:"Контакт уточняется",status:"filmed",link:"",note:""}
    ],equipment:[{id:1,name:"Sony FX3",holder:1},{id:2,name:"Штатив",holder:0},{id:3,name:"Sony A7 IV",holder:4}],updatedAt:Date.now()}}
    var state=load();
    try{if(localStorage.getItem(THEME_KEY)==="light")document.body.classList.add("light")}catch(e){}
    async function save(){
      state.updatedAt=Date.now();
      if(window.PlanerCloud){
        try{await window.PlanerCloud.save(JSON.parse(JSON.stringify(state)));return true}
        catch(e){notify("Не сохранено: "+(e.message||e));return false}
      }
      try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}
      catch(e){notify("Не удалось сохранить изменения в браузере");return false}
    }
    function employee(eid){return state.employees.find(function(e){return String(e.id)===String(eid)})}
    function empName(eid){return (employee(eid)||{}).name||"Не назначен"}
    function tasksFor(date,eid){return state.tasks.filter(function(t){return (!date||t.date===date)&&(!eid||String(t.employeeId)===String(eid))&&t.status!=="cancelled"}).sort(function(a,b){return a.date.localeCompare(b.date)||a.time.localeCompare(b.time)})}
    function isDone(t){return ["uploaded","checked","closed"].includes(t.status)}
    function isLate(t){return t.date<today&&!isDone(t)&&t.status!=="cancelled"}
    function pill(t){var c=isLate(t)?"bad":isDone(t)?"done":["filmed"].includes(t.status)?"warn":"";return '<span class="pill '+c+'">'+esc(statuses[t.status]||t.status)+(isLate(t)?" · просрочка":"")+"</span>"}
    function countHours(tasks){return (tasks.reduce(function(s,t){return s+n(t.duration)},0)/60).toFixed(1).replace(".",",")}
    function valueHTML(v){return esc(v||"—")}
    function overlap(t,skip){if(!t.employeeId||t.status==="cancelled")return null;var start=Number(t.time.slice(0,2))*60+Number(t.time.slice(3));var end=start+n(t.duration);return state.tasks.find(function(a){if(a.id===skip||a.status==="cancelled"||String(a.employeeId)!==String(t.employeeId)||a.date!==t.date)return false;var s=Number(a.time.slice(0,2))*60+Number(a.time.slice(3));return start<s+n(a.duration)&&s<end})}
    function notify(s){var el=document.getElementById("toast");if(el)el.remove();el=document.createElement("div");el.id="toast";el.className="toast";el.textContent=s;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.remove()},3800)}
    function button(label,act,extra){return '<button class="btn '+(extra||"")+'" data-action="'+act+'">'+label+"</button>"}
    function render(){var root=document.getElementById("app");var title={dashboard:"Обзор продакшена",calendar:"Ресурсный календарь",tasks:"Все съёмки",objects:"Объекты и архив",team:"Команда и оборудование",reports:"Аналитика"}[view];
      var shownNav=role==="operator"?nav.filter(function(v){return ["dashboard","calendar","tasks"].includes(v[0])}):nav;
      var aside='<aside class="aside"><div class="brand"><span class="brand-icon">◉</span>Планёр<span style="font-size:9px;color:var(--muted);align-self:flex-start">MVP</span></div><div class="eyebrow">Управление</div>'+
       shownNav.map(function(v){return '<button class="nav-link '+(view===v[0]?"active":"")+'" data-action="view" data-view="'+v[0]+'"><span class="nav-ico">'+v[1]+"</span>"+v[2]+"</button>"}).join("")+
       '<div class="aside-foot"><div class="chip">● Общая база Supabase</div><p>Изменения сохраняются в облаке, права проверяются сервером.</p></div></aside>';
      var head='<header class="header"><div><p class="eyebrow" style="margin:0 0 6px">PRODUCTION CONTROL</p><h1>'+title+'</h1><p class="sub">'+(role==="operator"?"Кабинет оператора · "+esc(empName(operatorId)):"Планирование и контроль съёмочного процесса")+'</p></div>'+
        '<div class="toolbar"><button class="btn hide-mobile" data-action="theme" title="Сменить тему">◐</button><button class="btn primary" data-action="new">＋ <span class="hide-mobile">Новая съёмка</span></button></div></header>';
      var selector='<div class="view-tools"><div class="list-tools"><label class="tiny muted" for="role">Режим:</label><select class="select" id="role" style="width:auto"><option value="coordinator" '+(role==="coordinator"?"selected":"")+'>Координатор</option><option value="operator" '+(role==="operator"?"selected":"")+'>Оператор (демо)</option></select>'+

    function field(label,name,val,type,required){return '<div class="field"><label for="f-'+name+'">'+esc(label)+'</label><input class="input" id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(val)+'" '+(required?"required":"")+' '+(type==="number"?'min="1"':"")+'></div>'}
    function generatePlan(date){var jobs=tasksFor(date);var msg=["ПЛАН СЪЁМОК — "+niceDate(date),""];if(!jobs.length)msg.push("На эту дату съёмок нет.");state.employees.forEach(function(e){var items=jobs.filter(function(t){return t.employeeId===e.id});if(!items.length)return;msg.push("◉ "+e.name+" · "+e.job);items.forEach(function(t,i){msg.push((i+1)+". "+t.time+" · "+t.title);msg.push("   Объект: "+t.project);msg.push("   Адрес: "+t.address);msg.push("   ТЗ: "+t.brief);msg.push("   Статус: "+statuses[t.status]);msg.push("")})});var free=jobs.filter(function(t){return !t.employeeId});if(free.length){msg.push("НЕ НАЗНАЧЕНО:");free.forEach(function(t){msg.push("• "+t.time+" — "+t.title)})}msg.push("План сформирован в приложении «Планёр».");return msg.join("\n")}
    async function copyPlan(){try{await navigator.clipboard.writeText(planText);notify("План скопирован");return}catch(e){}var temp=document.createElement("textarea");temp.value=planText;document.body.appendChild(temp);temp.select();try{document.execCommand("copy");notify("План скопирован")}catch(e){notify("Копирование недоступно — выделите текст вручную")}temp.remove()}
    function exportData(){var data=new Blob([JSON.stringify(state,null,2)],{type:"application/json;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(data);a.download="planer-backup-"+today+".json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);notify("Резервная копия создана")}
    function showModal(type,extra){modal=Object.assign({type:type},extra||{});render()}
    function setView(v){view=v;modal=null;render();window.scrollTo(0,0)}
    document.addEventListener("click",async function(e){
      var a=e.target.closest("[data-action]");if(!a){if(e.target.id==="overlay"){modal=null;render()}return}var action=a.dataset.action,taskid=a.dataset.id,t=state.tasks.find(function(x){return x.id===taskid});
      if(action==="cloud-logout"&&window.PlanerCloud){await window.PlanerCloud.logout();return}
      if(action==="view"){setView(a.dataset.view);return}
      if(action==="calendar"){setView("calendar");return}
      if(action==="theme"){document.body.classList.toggle("light");localStorage.setItem(THEME_KEY,document.body.classList.contains("light")?"light":"dark");return}
      if(action==="new"){showModal("new");return}
      if(action==="close"){modal=null;render();return}
      if(action==="details"&&t){showModal("details",{id:taskid});return}
      if(action==="edit"&&t){showModal("edit",{id:taskid});return}
      if(action==="material"&&t){showModal("material",{id:taskid});return}
      if(action==="status"&&t){
        if(window.PlanerCloud&&role==="operator"){
          try{await window.PlanerCloud.progress(t.id,a.dataset.status);showModal("details",{id:taskid});notify("Статус обновлён")}
          catch(err){notify("Не удалось: "+err.message);await window.PlanerCloud.refresh(true)}
          return;
        }
        t.status=a.dataset.status;if(!(await save()))return;
        showModal("details",{id:taskid});notify("Статус обновлён");return
      }
      if(action==="week-prev"){selectedDay=addDays(selectedDay,-7);render();return}
      if(action==="week-next"){selectedDay=addDays(selectedDay,7);render();return}
      if(action==="week-today"){selectedDay=today;render();return}
      if(action==="select-day"){selectedDay=a.dataset.date;render();return}
      if(action==="plan"){planText=generatePlan(view==="calendar"?selectedDay:today);showModal("plan");return}
      if(action==="copy-plan"){copyPlan();return}
      if(action==="object"){showModal("object",{name:a.dataset.name});return}
      if(action==="add-person"){showModal("add-person");return}
      if(action==="equipment"){showModal("equipment",{id:Number(taskid)});return}
      if(action==="give-equipment"){var q=state.equipment.find(function(x){return x.id===Number(taskid)});if(q){q.holder=Number(document.getElementById("equipment-person").value);if(!(await save()))return;modal=null;render();notify("Выдача отмечена")}return}
      if(action==="return-equipment"){var qq=state.equipment.find(function(x){return x.id===Number(taskid)});if(qq){qq.holder=0;if(!(await save()))return;modal=null;render();notify("Возврат отмечен")}return}
      if(action==="export"){exportData();return}
      if(action==="import"){var f=document.createElement("input");f.type="file";f.accept="application/json,.json";f.onchange=function(){if(!f.files||!f.files[0])return;f.files[0].text().then(function(str){var next=JSON.parse(str);if(!Array.isArray(next.tasks)||!Array.isArray(next.employees))throw Error("Неверная структура");if(!confirm("Заменить текущие данные резервной копией?"))return;state=next;save().then(function(ok){if(ok){render();notify("Данные восстановлены")}})}).catch(function(){notify("Не удалось прочитать файл")})};f.click();return}
    });
    document.addEventListener("change",function(e){
      if(e.target.id==="role"){role=e.target.value;view="dashboard";render()}
      if(e.target.id==="operator"){operatorId=Number(e.target.value);render()}
      if(e.target.id==="status-filter"){statusFilter=e.target.value;render()}
    });
    document.addEventListener("input",function(e){if(e.target.id==="search"){search=e.target.value;var start=e.target.selectionStart;render();var el=document.getElementById("search");if(el){el.focus();el.setSelectionRange(start,start)}}});
    document.addEventListener("submit",async function(e){e.preventDefault();var form=e.target,fd=new FormData(form);
      if(form.id==="task-form"){
        var t=modal&&modal.type==="edit"?state.tasks.find(function(x){return x.id===modal.id}):null;
        var incoming={title:String(fd.get("title")||"").trim(),project:String(fd.get("project")||"").trim(),address:String(fd.get("address")||"").trim(),date:String(fd.get("date")||""),time:String(fd.get("time")||""),duration:n(fd.get("duration")),employeeId:n(fd.get("employeeId")),type:String(fd.get("type")||"Видео"),brief:String(fd.get("brief")||"").trim(),details:String(fd.get("details")||"").trim(),contact:String(fd.get("contact")||"").trim(),status:String(fd.get("status")||"assigned")};
        if(!incoming.title||!incoming.project||!incoming.address||!incoming.brief||!incoming.date||!incoming.time||incoming.duration<=0){notify("Заполните обязательные поля");return}
        var clash=overlap(incoming,t?t.id:null);
        if(clash){document.getElementById("form-error").innerHTML='<div class="notice" style="margin-top:15px">Пересечение расписания с задачей «'+esc(clash.title)+'» ('+esc(clash.time)+'). Выберите другое время или исполнителя.</div>';return}
        if(t)Object.assign(t,incoming);else state.tasks.push(Object.assign({id:id(),link:"",note:""},incoming));
        if(!(await save()))return;modal=null;view="tasks";render();notify("Съёмка сохранена");return
      }
      if(form.id==="material-form"){
        var t2=state.tasks.find(function(x){return x.id===modal.id});
        var link=String(fd.get("link")||"").trim();
        if(!url(link)||!link.startsWith("https://")){notify("Укажите действительную HTTPS-ссылку");return}
        if(t2){
          var note=String(fd.get("note")||"");
          if(window.PlanerCloud&&role==="operator"){
            try{await window.PlanerCloud.progress(t2.id,"uploaded",link,note);modal=null;render();notify("Материалы переданы")}
            catch(err){notify("Не удалось: "+err.message);await window.PlanerCloud.refresh(true)}
            return;
          }
          t2.link=link;t2.note=note;t2.status="uploaded";
          if(!(await save()))return;
          modal=null;render();notify("Ссылка на материалы сохранена");
        }
        return
      }
      if(form.id==="person-form"){var name=String(fd.get("name")||"").trim(),job=String(fd.get("job")||"").trim(),hours=n(fd.get("hours"));if(!name||!job||hours<1||hours>24){notify("Проверьте поля сотрудника");return}state.employees.push({id:Date.now(),name:name,job:job,hours:hours});if(!(await save()))return;modal=null;render();notify("Сотрудник добавлен");return}
    });
    document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modal){modal=null;render()}});
    if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
    window.__PLANER_BRIDGE={
      boot:function(snapshot,member,list,revision){
        if(!snapshot||!Array.isArray(snapshot.tasks)||!Array.isArray(snapshot.employees)){notify("Некорректный ответ сервера");return}
        state=snapshot;
        role=member.role==="operator"?"operator":"coordinator";
        operatorId=Number(member.employee_id)||0;
        if(role==="operator"&&["team","objects","reports"].includes(view))view="dashboard";
        render();
      },
      importLocal:async function(){
        if(!window.PlanerCloud||window.PlanerCloud.profile?.role!=="admin")throw Error("Только администратор может переносить архив.");
        var raw=localStorage.getItem(STORAGE);
        if(!raw)throw Error("На этом устройстве нет сохранённых данных прежней версии.");
        var old;
        try{old=JSON.parse(raw)}catch(e){throw Error("Данные старой версии повреждены.")}
        if(!old||!Array.isArray(old.tasks)||!Array.isArray(old.employees)||!Array.isArray(old.equipment))throw Error("Неверный формат архива.");
        if(!confirm("Перенести "+old.tasks.length+" съёмок и "+old.employees.length+" сотрудников в общую базу? Текущие записи облака будут заменены."))return;
        var previous=state;
        state=old;
        if(!(await save())){state=previous;throw Error("Перенос не выполнен.")}
        render();notify("Архив перенесён в общую базу.");
      }
    };
    render();
    if(window.PlanerCloud)window.PlanerCloud.start(window.__PLANER_BRIDGE);
  })();
  </script>
</body>
